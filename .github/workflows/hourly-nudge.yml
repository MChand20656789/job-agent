name: Hourly Nudge

on:
  schedule:
    - cron: '0 9-18 * * *'  # Every hour 9am-6pm Ventura time = 4pm-1am UTC
  workflow_dispatch:  # lets you test manually

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Reminder
        run: |
          MESSAGE="⏰ CHECK EMAIL + TEXTS + LINKEDIN NOW%0A%0AReply to recruiters within 4 hours per your rule.%0A%0AApplied this week: check Job Applications tab"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.CHAT_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode="HTML"
